setup.title=在你的 App 里接入 DroidLens SDK
setup.intro=<html>这台设备上没有运行中的、接入了 SDK 的 debug App。DroidLens 只负责显示，数据是 App 里的 SDK 采集的。<br>SDK 由 Gradle 插件<b>只加到 debug 包里</b>（release 包里没有，也不用改业务代码）。</html>
setup.step1=<html><b>1.</b> 在 <code>settings.gradle(.kts)</code> 的<b>两处</b>都加上仓库：</html>
setup.step2=<html><b>2.</b> 在 app 模块应用 Gradle 插件：</html>
setup.step3=<html><b>3.</b> 重新编译运行 debug 包，点上方的 ↻。App 出现在列表里后，选中它再点 ▶ 连接。</html>
setup.copy=复制
setup.docs=接入文档和更多选项
