org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true

# SDK 版本号，唯一来源：runtime AAR、Gradle 插件、运行时 Helper.VERSION 都从这里取。
# 改版本只改这一行，然后 ../scripts/publish-sdk.sh
helper.version=0.1.2
# 公开 maven 仓库所在的 GitHub 仓库（owner/name）。使用方从
# https://raw.githubusercontent.com/<这里>/main/mvn-repo/ 拉 SDK
helper.githubRepo=kakakakacat/android-helper
