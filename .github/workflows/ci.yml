# 每次推送 / PR：编译并测试所有组件。真机测试（ANDROIDHELPER_E2E）在 CI 上自动跳过。
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["mvn-repo/**", "**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # IDE 插件编译所针对的 Android Studio（CI 上没有本机安装，按版本下载）
  ANDROID_STUDIO_VERSION: "2026.1.4.7"

jobs:
  sdk:
    name: SDK (runtime + Gradle plugin + sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build sample (debug + release) and check release isolation
        working-directory: sdk
        run: |
          ./gradlew --console=plain :sample:assembleDebug :sample:assembleRelease :sample:androidHelperReport
          # release 包里不能有任何 SDK 代码
          n=$(unzip -p sample/build/outputs/apk/release/sample-release-unsigned.apk 'classes*.dex' | LC_ALL=C grep -a -c "kakacat/android/helper/\(layout\|network\)/\|kakacat/android/helper/Helper" || true)
          echo "SDK references in release dex: $n"
          test "$n" = "0"

  client-and-mcp:
    name: Client library + MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --console=plain test
        working-directory: client
      - run: ./gradlew --console=plain test fatJar
        working-directory: mcp
      - uses: actions/upload-artifact@v7
        with:
          name: android-helper-mcp
          path: mcp/build/libs/android-helper-mcp.jar

  ide-plugin:
    name: IDE plugin (build + Plugin Verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, verify structure
        working-directory: ide-plugin
        run: ./gradlew --console=plain -PandroidStudioVersion=$ANDROID_STUDIO_VERSION test buildPlugin verifyPluginStructure
      - name: Plugin Verifier (oldest supported + newest Android Studio)
        working-directory: ide-plugin
        run: ./gradlew --console=plain -PandroidStudioVersion=$ANDROID_STUDIO_VERSION -PverifyAndroidStudio=2024.3.2.14,2026.2.1.8 verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: ide-plugin
          path: ide-plugin/build/distributions/*.zip
